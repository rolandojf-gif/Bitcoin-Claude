<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Análisis interactivo sobre la tesis macro de Bitcoin, con un simulador de escenarios y una calculadora de promediado de posición." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BTC Macro Tesis</title>
    <!--
      Loaded here rather than via @import in index.css: Tailwind expands its own
      @import inline, which pushed the font @import below other rules in the built
      CSS, making browsers ignore it. A <link> also avoids the request waterfall.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
